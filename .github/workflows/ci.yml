# Runs only checks that need no credentials and nothing that deploys.
# No aio login, no API Mesh create/update: `build` only writes mesh.json locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the package.json version
        run: |
          node -e "const v = require('./package.json').version; if (!/^[0-9]+[.][0-9]+[.][0-9]+(-(alpha|beta)[.][0-9]+)?$/.test(v)) { console.error('Not a valid version in package.json', v); process.exit(1); }"

      # engines: node >=18. Installs exactly what package-lock.json pins.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build mesh.json (local file only)
        run: npm run build -- --force
